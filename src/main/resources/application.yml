server:
  address: 0.0.0.0
  port: 8080
spring:
  data:
    redis:
      url: ${REDIS_URL}
      timeout: 2s
mottainai:
  jwt:
    secret: ${JWT_SECRET}
    algorithm: ${JWT_ALGORITHM:HS256}
  stream:
    key: ${NOTIFICATION_STREAM_KEY:mottainai:v1:notification:stream}
    group: ${NOTIFICATION_STREAM_GROUP:notification-writers}
    consumer: ${HOSTNAME:mobile-api}
    reclaim-idle-ms: ${NOTIFICATION_STREAM_RECLAIM_IDLE_MS:60000}
